<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Controller</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }

        /* While there's a match to watch: controls on the left, the game on the right. */
        body.watching { max-width: none; margin: 1rem 0; }
        .layout { display: flex; gap: 1rem; align-items: flex-start; }
        .controls { flex: 1; min-width: 0; }
        body.watching .controls { flex: 0 0 420px; }
        #viewer { flex: 1; position: sticky; top: 1rem; height: calc(100vh - 2rem); }
        #viewer iframe { width: 100%; height: 100%; border: 1px solid #ccc; border-radius: 8px; }
        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            body.watching .controls { flex: none; width: 100%; }
            #viewer { position: static; width: 100%; height: 70vh; }
        }

        section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        h2 { margin-top: 0; font-size: 1.1rem; }
        label { display: inline-block; margin: 0.25rem 0.5rem 0.25rem 0; }
        button { margin: 0.25rem 0.5rem 0.25rem 0; }
        #error { color: #b00020; }
        #log { background: #f4f4f4; padding: 0.5rem; max-height: 300px; overflow-y: auto; font-size: 0.85rem; }
        .hidden { display: none; }
        .setting { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0; }
        .setting > span:first-child { width: 11rem; }
        .setting strong { min-width: 2rem; text-align: center; }
        #army-unit-buttons button.active, #building-unit-buttons button.active { font-weight: bold; outline: 2px solid #1a73e8; }
    </style>
</head>
<body>
  <div class="layout">
   <div class="controls">
    <h1>Bot Controller</h1>
    <p><span id="health"></span></p>
    <p>Game server: <a id="server" target="_blank"></a></p>
    <p id="error"></p>

    <!-- Step 1: sign the bot up with the game server (only needed once) -->
    <section id="register-section" class="hidden">
        <h2>Register your bot</h2>
        <label>Bot name <input id="bot-name" placeholder="3-32 letters, digits, - or _"></label>
        <button id="register-button">Register</button>
    </section>

    <!-- Step 2: get into a match -->
    <section id="start-section" class="hidden">
        <h2>Start a match</h2>
        <label>Speed (ms per tick) <input id="tick-ms" type="number" value="1000" min="100" max="10000"></label>
        <div>
            <label>Opponent
                <select id="opponent">
                    <option value="sitter">Sleepy Sitter (easiest)</option>
                    <option value="economist">Grub Hoarder</option>
                    <option value="balanced">Blue Badger</option>
                    <option value="rusher">Honey Badger (hardest)</option>
                </select>
            </label>
            <button id="play-house-button">Play house bot</button>
        </div>
        <div>
            <label>Match name <input id="match-name" placeholder="our-game"></label>
            <button id="create-button">Create</button>
            <button id="join-button">Join</button>
        </div>
    </section>

    <!-- Pick how the bot plays; can be changed before or during a match -->
    <section id="strategy-section" class="hidden">
        <h2>Strategy</h2>
        <div class="setting">
            <span>Workers to train</span>
            <button data-setting="workers" data-step="-1">&minus;</button>
            <strong id="workers-value">-</strong>
            <button data-setting="workers" data-step="1">+</button>
        </div>
        <div class="setting">
            <span>Army unit</span>
            <span id="army-unit-buttons"></span>
        </div>
        <div class="setting">
            <span>Attack once army has</span>
            <button data-setting="attackSize" data-step="-1">&minus;</button>
            <strong id="attackSize-value">-</strong>
            <button data-setting="attackSize" data-step="1">+</button>
        </div>
        <div class="setting">
            <span>Building to make</span>
            <span id="building-unit-buttons"></span>
        </div>
        <div class="setting">
            <span>Build at</span>
            <label>X <input id="build-x" type="number" min="0" value="0" style="width: 4rem"></label>
            <label>Y <input id="build-y" type="number" min="0" value="0" style="width: 4rem"></label>
        </div>
        <div class="setting">
            <span>Workers per building</span>
            <button data-setting="builders" data-step="-1">&minus;</button>
            <strong id="builders-value">-</strong>
            <button data-setting="builders" data-step="1">+</button>
        </div>
        <div>
            <button id="apply-strategy-button" disabled>Apply strategy</button>
            <button id="discard-strategy-button" disabled>Discard changes</button>
            <span id="strategy-pending" class="hidden">Unsaved changes; the bot is still using the old strategy.</span>
        </div>
    </section>

    <!-- Step 3: watch it play -->
    <section>
        <h2>Status</h2>
        <p>Bot: <strong id="player-name">-</strong> &middot; <span id="phase">-</span></p>
        <p id="match-info"></p>
        <p><a id="watch-link" class="hidden" target="_blank">Watch the match live</a></p>
        <button id="stop-button" class="hidden">Surrender &amp; stop</button>
        <pre id="log"></pre>
    </section>
   </div>

    <!-- The game server's live spectator view of the current match -->
    <div id="viewer" class="hidden">
        <iframe id="viewer-frame" title="Live match"></iframe>
    </div>
  </div>

    <script>
        const busyPhases = ["Joining", "Waiting for players", "Playing"];
        let lastStatus = null;
        // Strategy changes not yet applied; null means the page just shows what the bot is using.
        let draft = null;

        window.addEventListener("load", () => {
            checkHealth();

            document.getElementById("register-button").addEventListener("click", () =>
                post("/api/bot/register", { name: document.getElementById("bot-name").value }));

            document.getElementById("play-house-button").addEventListener("click", () =>
                post("/api/bot/start", { opponent: document.getElementById("opponent").value, tickMs: tickMs() }));

            document.getElementById("create-button").addEventListener("click", () =>
                post("/api/bot/start", { createMatch: document.getElementById("match-name").value, tickMs: tickMs() }));

            document.getElementById("join-button").addEventListener("click", () =>
                post("/api/bot/start", { joinMatch: document.getElementById("match-name").value }));

            document.getElementById("stop-button").addEventListener("click", () =>
                post("/api/bot/stop"));

            // The - / + buttons nudge one number in the draft plan.
            for (const button of document.querySelectorAll("[data-setting]")) {
                button.addEventListener("click", () => {
                    const setting = button.dataset.setting;
                    editDraft({ [setting]: shownPlan()[setting] + Number(button.dataset.step) });
                });
            }

            for (const setting of ["buildX", "buildY"]) {
                const input = document.getElementById(setting === "buildX" ? "build-x" : "build-y");
                input.addEventListener("input", () => editDraft({ [setting]: Number(input.value) }));
            }

            // Only Apply sends the plan to the bot.
            document.getElementById("apply-strategy-button").addEventListener("click", async () => {
                if (await post("/api/bot/strategy", draft)) {
                    draft = null;
                    showStrategies(lastStatus);
                }
            });

            document.getElementById("discard-strategy-button").addEventListener("click", () => {
                draft = null;
                showStrategies(lastStatus);
            });

            refreshStatus();
            setInterval(refreshStatus, 1000);
        });

        async function checkHealth() {
            const health = document.getElementById("health");
            try {
                const response = await fetch("/api/health");
                const status = await response.text();
                health.textContent = `API health: ${status}`;
            } catch (error) {
                health.textContent = `API health: unreachable (${error.message})`;
            }
        }

        function tickMs() {
            return Number(document.getElementById("tick-ms").value) || 1000;
        }

        // Sends a command to our backend, then shows the status it answers with (or its error).
        // Returns whether it worked.
        async function post(url, body) {
            const error = document.getElementById("error");
            error.textContent = "";
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body ?? {})
                });
                const data = await response.json();
                if (!response.ok) {
                    error.textContent = data.message ?? `Request failed (${response.status})`;
                    return false;
                }
                showStatus(data);
                return true;
            } catch (e) {
                error.textContent = `Request failed: ${e.message}`;
                return false;
            }
        }

        async function refreshStatus() {
            try {
                const response = await fetch("/api/bot/status");
                showStatus(await response.json());
            } catch (e) {
                document.getElementById("phase").textContent = `backend unreachable (${e.message})`;
            }
        }

        function showStatus(status) {
            const busy = busyPhases.includes(status.phase);
            lastStatus = status;

            const server = document.getElementById("server");
            server.textContent = status.server;
            server.href = status.server;

            document.getElementById("register-section").classList.toggle("hidden", status.registered);
            document.getElementById("strategy-section").classList.toggle("hidden", !status.registered);
            showStrategies(status);
            document.getElementById("start-section").classList.toggle("hidden", !status.registered || busy);
            document.getElementById("stop-button").classList.toggle("hidden", !busy);

            document.getElementById("player-name").textContent = status.playerName ?? "not registered";
            document.getElementById("phase").textContent = status.phase;

            document.getElementById("match-info").textContent = status.tick == null ? "" :
                `Tick ${status.tick} / ${status.maxTicks} · ${status.ore} grubs · ${status.units} badgers · ${status.buildings} buildings`;

            const watch = document.getElementById("watch-link");
            watch.classList.toggle("hidden", !status.watchUrl);
            if (status.watchUrl) {
                watch.href = status.watchUrl;
            }

            // Status refreshes every second, so only load the game view when the match changes.
            const frame = document.getElementById("viewer-frame");
            document.body.classList.toggle("watching", !!status.watchUrl);
            document.getElementById("viewer").classList.toggle("hidden", !status.watchUrl);
            if (status.watchUrl && frame.dataset.url !== status.watchUrl) {
                frame.dataset.url = status.watchUrl;
                frame.src = status.watchUrl;
            }

            document.getElementById("log").textContent = status.log.join("\n");
        }

        // The plan the page shows: the draft if there is one, otherwise the bot's current plan.
        function shownPlan() {
            return draft ?? lastStatus.strategy;
        }

        // Changes some settings in the draft (starting it from the bot's plan if needed) without sending anything.
        function editDraft(changes) {
            draft = { ...shownPlan(), ...changes };
            showStrategies(lastStatus);
        }

        // Shows the plan: the numbers, plus one button per army unit and per building with the chosen ones highlighted.
        function showStrategies(status) {
            const plan = shownPlan();
            document.getElementById("workers-value").textContent = plan.workers;
            document.getElementById("attackSize-value").textContent = plan.attackSize;
            document.getElementById("builders-value").textContent = plan.builders;

            // Don't overwrite the X / Y boxes while they're being edited.
            if (!draft) {
                document.getElementById("build-x").value = plan.buildX;
                document.getElementById("build-y").value = plan.buildY;
            }

            showChoices("army-unit-buttons", status.armyUnits, "armyUnit", plan.armyUnit);
            showChoices("building-unit-buttons", status.buildingUnits, "buildingUnit", plan.buildingUnit);

            document.getElementById("apply-strategy-button").disabled = !draft;
            document.getElementById("discard-strategy-button").disabled = !draft;
            document.getElementById("strategy-pending").classList.toggle("hidden", !draft);
        }

        // Fills a row with one button per option; clicking one sets that setting in the draft.
        function showChoices(id, options, setting, chosen) {
            const row = document.getElementById(id);
            if (row.children.length !== options.length) {
                row.replaceChildren(...options.map(option => {
                    const button = document.createElement("button");
                    button.textContent = option;
                    button.dataset.option = option;
                    button.addEventListener("click", () => editDraft({ [setting]: option }));
                    return button;
                }));
            }

            for (const button of row.children) {
                button.classList.toggle("active", button.dataset.option === chosen);
            }
        }
    </script>
</body>
</html>
